<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 포켓몬 테스트</title>
    <style>
        /* 기본 설정 및 폰트 */
        body {
            background-color: #FFF9E6; /* 따뜻한 크림색 배경 */
            color: #333;
            font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* 메인 컨테이너 */
        #app-container {
            background: #FFFFFF;
            max-width: 500px;
            width: 100%;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 3px solid #FFE082; /* 따뜻한 노란색 테두리 */
        }

        h1 {
            color: #F57F17;
            font-size: 1.8rem;
            margin-bottom: 5px;
            word-break: keep-all;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #795548;
            margin-bottom: 30px;
        }

        /* MBTI 버튼 그리드 */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .mbti-btn {
            background-color: #FFF3E0;
            border: 2px solid #FFE0B2;
            color: #E65100;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 15px 5px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .mbti-btn:hover {
            background-color: #FFE0B2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(230, 81, 0, 0.15);
        }

        /* 결과 화면 섹션 (기본적으로 숨김) */
        #result-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .emoji-display {
            font-size: 5rem;
            margin: 10px 0;
        }

        .pokemon-name {
            font-size: 2.2rem;
            font-weight: bold;
            color: #E65100;
            margin: 10px 0;
        }

        .pokemon-desc {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #5D4037;
            background: #FFF8E1;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            word-break: keep-all;
        }

        .match-info {
            font-size: 1.1rem;
            color: #00796B;
            background: #E0F2F1;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        /* 다시 고르기 버튼 */
        .retry-btn {
            background-color: #FFB300;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 179, 0, 0.3);
            transition: background 0.2s;
            width: 100%;
            max-width: 250px;
        }

        .retry-btn:hover {
            background-color: #FFA000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 모바일 화면 대응 */
        @media (max-width: 400px) {
            .mbti-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 1.5rem; }
            .emoji-display { font-size: 4rem; }
            .pokemon-name { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 메인 화면 (MBTI 선택) -->
        <div id="selection-section">
            <h1>MBTI 찰떡 포켓몬 찾기 🔍</h1>
            <p class="subtitle">나의 MBTI 유형을 선택해주세요!</p>
            
            <div class="mbti-grid" id="mbti-buttons">
                <!-- 자바스크립트로 버튼이 생성됩니다 -->
            </div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-section">
            <h1 style="font-size: 1.4rem; color: #795548;">당신과 어울리는 포켓몬은...</h1>
            <div class="emoji-display" id="result-emoji">❓</div>
            <div class="pokemon-name" id="result-name">포켓몬 이름</div>
            <div class="pokemon-desc" id="result-desc">이유 설명</div>
            <div class="match-info" id="result-match">💖 환상의 궁합: </div>
            <button class="retry-btn" onclick="resetTest()">🔄 다시 고르기</button>
        </div>
    </div>

    <script>
        // 포켓몬 데이터베이스
        const mbtiData = {
            "ISTJ": { name: "거북왕", emoji: "🐢💧", desc: "성실하고 묵묵하게 자기 역할을 다하는 든든한 방패 같은 존재입니다. 규칙을 잘 지키며 책임감이 강해 모두가 믿고 의지할 수 있어요.", match: "ESFP (푸린)" },
            "ISFJ": { name: "해피너스", emoji: "🥚💖", desc: "따뜻한 마음으로 모두를 치유하고 배려해 주는 다정한 성격입니다. 헌신적이고 눈치가 빨라 주변 사람들에게 큰 위로가 됩니다.", match: "ESTP (피카츄)" },
            "INFJ": { name: "루카리오", emoji: "🐺🔵", desc: "파동을 읽는 깊은 통찰력과 이상을 향해 나아가는 굳은 신념을 가졌습니다. 겉으로는 차분하지만 내면에는 뜨거운 정의감이 있습니다.", match: "ENFP (토게피)" },
            "INTJ": { name: "뮤츠", emoji: "🧬🔮", desc: "뛰어난 지능과 전략적인 사고로 상황을 주도하는 완벽주의자입니다. 독립적이고 분석력이 뛰어나 문제 해결 능력이 탁월합니다.", match: "ENTP (팬텀)" },
            "ISTP": { name: "핫삼", emoji: "✂️🔴", desc: "냉철한 판단력과 뛰어난 순발력으로 위기를 타파하는 실용주의자입니다. 평소엔 조용하지만 필요할 땐 확실하게 행동합니다.", match: "ESFJ (이상해씨)" },
            "ISFP": { name: "잠만보", emoji: "💤🥞", desc: "여유롭고 느긋하며 현재의 평화로운 삶을 가장 중요하게 생각합니다. 다투는 것을 싫어하고 주변을 편안하게 만드는 매력이 있습니다.", match: "ESTJ (리자몽)" },
            "INFP": { name: "메타몽", emoji: "🟣✨", desc: "말랑말랑한 감수성으로 누구와도 형태를 맞출 수 있는 유연함이 있습니다. 상상력이 풍부하고 타인의 감정에 깊이 공감합니다.", match: "ENFJ (망나뇽)" },
            "INTP": { name: "야도란", emoji: "🐚🧠", desc: "멍해 보이지만 머릿속으로는 깊고 복잡한 생각에 잠겨 있는 철학자입니다. 지적 호기심이 많고 자신만의 세계가 아주 뚜렷합니다.", match: "ENTJ (갸라도스)" },
            "ESTP": { name: "피카츄", emoji: "⚡🐭", desc: "에너지 넘치고 호기심 많으며 어디서든 주목받는 타고난 스타입니다. 행동력이 뛰어나고 현재의 즐거움을 만끽할 줄 압니다.", match: "ISFJ (해피너스)" },
            "ESFP": { name: "푸린", emoji: "🎤🎈", desc: "노래와 춤을 사랑하며 사람들을 즐겁게 해주는 분위기 메이커입니다. 긍정적이고 사교적이라 주변에 늘 사람이 넘쳐납니다.", match: "ISTJ (거북왕)" },
            "ENFP": { name: "토게피", emoji: "🐣✨", desc: "순수하고 호기심 가득한 눈으로 세상을 바라보는 해피 바이러스입니다. 열정적이고 창의적이며 매일매일이 새로운 모험입니다.", match: "INFJ (루카리오)" },
            "ENTP": { name: "팬텀", emoji: "👻😈", desc: "장난기가 멈추지 않고 번뜩이는 아이디어로 가득한 예측불허의 매력을 가졌습니다. 두뇌 회전이 빠르고 논쟁을 즐기는 편입니다.", match: "INTJ (뮤츠)" },
            "ESTJ": { name: "리자몽", emoji: "🐉🔥", desc: "강력한 리더십과 뜨거운 열정으로 목표를 향해 돌진하는 지휘관입니다. 체계적이고 현실적이며 무리를 이끄는 데 능숙합니다.", match: "ISFP (잠만보)" },
            "ESFJ": { name: "이상해씨", emoji: "🌿🌱", desc: "친절하고 싹싹하며 주변 사람들을 꼼꼼하게 챙기는 마당발입니다. 협동심이 강하고 타인에게 도움을 주는 것을 기뻐합니다.", match: "ISTP (핫삼)" },
            "ENFJ": { name: "망나뇽", emoji: "🐲💌", desc: "다정하고 온화한 성품으로 곤경에 처한 사람을 지나치지 못하는 수호자입니다. 타인의 성장을 돕고 이끄는 따뜻한 리더입니다.", match: "INFP (메타몽)" },
            "ENTJ": { name: "갸라도스", emoji: "🌊🐉", desc: "압도적인 카리스마와 불굴의 의지로 목표를 쟁취하는 타고난 리더입니다. 단호한 결단력과 추진력으로 큰 성과를 이뤄냅니다.", match: "INTP (야도란)" }
        };

        // MBTI 버튼 생성 로직
        const mbtiKeys = Object.keys(mbtiData);
        const buttonContainer = document.getElementById('mbti-buttons');

        mbtiKeys.forEach(mbti => {
            const btn = document.createElement('button');
            btn.className = 'mbti-btn';
            btn.innerText = mbti;
            btn.onclick = () => showResult(mbti);
            buttonContainer.appendChild(btn);
        });

        // 결과 보여주기 함수
        function showResult(mbti) {
            const data = mbtiData[mbti];
            
            // 데이터 채우기
            document.getElementById('result-emoji').innerText = data.emoji;
            document.getElementById('result-name').innerText = data.name;
            document.getElementById('result-desc').innerText = data.desc;
            document.getElementById('result-match').innerHTML = `💖 <b>환상의 짝꿍:</b> ${data.match}`;

            // 화면 전환
            document.getElementById('selection-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
        }

        // 다시 고르기 함수
        function resetTest() {
            // 화면 전환
            document.getElementById('result-section').style.display = 'none';
            document.getElementById('selection-section').style.display = 'block';
        }
    </script>
</body>
</html>
